<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051415"/>
      <stop offset="50%" stop-color="#070c16"/>
      <stop offset="100%" stop-color="#0b2426"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dbaa67"/>
      <stop offset="100%" stop-color="#f5d7a6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
  </g>

  <!-- Glassmorphic Card Container -->
  <rect x="300" y="220" width="600" height="360" rx="24" fill="url(#cardGrad)" stroke="rgba(219,170,103,0.3)" stroke-width="1.5"/>

  <!-- Icon: Camera / Image placeholder -->
  <g transform="translate(600, 340)" stroke="url(#goldGrad)" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-40" y="-25" width="80" height="55" rx="8"/>
    <circle cx="0" cy="2" r="16"/>
    <path d="M-15,-25 L-8,-35 L8,-35 L15,-25"/>
    <!-- Diagonal caution lines across icon -->
    <line x1="-30" y1="35" x2="30" y2="-35" stroke="rgba(219,170,103,0.3)" stroke-width="2"/>
  </g>

  <!-- Badge Text -->
  <text x="600" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#dbaa67">
    IMAGEN FALTANTE
  </text>

  <text x="600" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="rgba(255,255,255,0.4)">
    RENDERS Y PLANOS EN PROCESO DE PRODUCCIÓN
  </text>
</svg>
